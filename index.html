<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ballworks">
<meta name="theme-color" content="#f1f2f4">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Ballworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: one 390pt-wide phone column, scaled to fit the viewport; screens are flex columns. */
:root {
  color-scheme: light;
  --alu-hi: #f1f2f4; --alu-mid: #d6d9dd; --alu-lo: #c3c7cc;
  --tile-hi: #f3f4f6; --tile-lo: #c2c6cb;
  --steel-hi: #8d939a; --steel-lo: #767c84;
  --groove: #0b0c0d;
  --brass: #c9a24a; --brass-hi: #e0bd63; --brass-lo: #a47b2c; --brass-edge: #6b4f17; --brass-ink: #1b1408;
  --valve: #e2552b; --signal: #7ed957;
  --ink: #1f2124; --ink-2: #3b3f45; --ink-3: #2f3237;
  --deck-hi: #b7bcc2; --deck-lo: #a3a9b0;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --spring: cubic-bezier(.3, 1.7, .5, 1);
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: linear-gradient(180deg, var(--alu-hi), var(--alu-mid) 50%, var(--alu-lo));
  color: var(--ink); font-family: var(--f-body); -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
#app { position: fixed; top: 0; left: 0; width: 390px; transform-origin: 0 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.screen[hidden] { display: none !important; }
.mono { font-family: var(--f-mono); }
.disp { font-family: var(--f-display); }

/* ---------- HOME ---------- */
#home { overflow-y: auto; overflow-x: hidden; padding-top: env(safe-area-inset-top, 0px); }
.home-head { padding: 22px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; }
.logo { font-family: var(--f-display); font-weight: 900; font-size: 48px; line-height: .9; letter-spacing: .03em; margin: 0; }
.tagline { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.knob-cap { width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #fff, #b4b9bf 75%);
  box-shadow: 0 4px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center;
  transition: transform .2s var(--spring); }
.knob[aria-pressed="false"] .knob-cap { transform: rotate(-60deg); }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 10px var(--signal); transition: background .15s, box-shadow .15s; }
.knob[aria-pressed="false"] .led { background: #4a4b50; box-shadow: none; }
.knob-label { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; color: var(--ink-2); }

.cont { margin: 18px 20px 0; padding: 16px; border-radius: 18px; background: linear-gradient(160deg, #d6b25a, #9c7429); color: var(--brass-ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 10px 24px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 14px; text-align: left; width: calc(100% - 40px); }
.cont-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .14em; }
.cont-mid { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.cont-id { font-family: var(--f-display); font-weight: 900; font-size: 40px; line-height: .9; }
.cont-name { font-size: 22px; font-weight: 800; margin-top: 6px; }
.cont-go { padding: 12px 18px; border-radius: 12px; background: #1b1c1e; color: #e9c46a; font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 #0b0b0c; white-space: nowrap; transition: transform .06s; }
.cont:active .cont-go { transform: translateY(2px); box-shadow: 0 1px 0 #0b0b0c; }
.segs { display: grid; gap: 5px; }
.seg { height: 8px; border-radius: 4px; background: rgba(27,28,30,.25); box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
.seg.on { background: #1b1c1e; } .seg.now { background: #fff3cf; }

.sec-label { padding: 18px 24px 8px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; color: var(--ink-2); }
.chapters { display: flex; flex-direction: column; gap: 8px; padding: 0 20px; }
.ch { border-radius: 14px; background: linear-gradient(180deg, #f7f8f9, #dadde1); box-shadow: inset 0 1px 0 #fff, 0 2px 0 #9ea3a9; overflow: hidden; }
.ch-row { display: flex; align-items: center; gap: 14px; padding: 9px 14px; width: 100%; text-align: left; }
.ch-num { width: 40px; height: 40px; border-radius: 10px; background: #141516; box-shadow: inset 0 2px 4px rgba(0,0,0,.7);
  display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 800; font-size: 20px; color: #d9b65e; flex: none; }
.ch-txt { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ch-name { font-weight: 600; font-size: 15px; }
.ch-sub { font-size: 12px; color: var(--ink-2); }
.ch-prog { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.ch.locked { opacity: .5; }
.ch.locked .ch-row { cursor: default; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 14px 12px; }
.levels[hidden] { display: none; }
.lv { height: 52px; border-radius: 10px; background: linear-gradient(180deg, #fbfcfc, #d3d7db); box-shadow: 0 2px 0 #9ea3a9, inset 0 1px 0 #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: transform .06s; }
.lv:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 0 0 #9ea3a9; }
.lv-id { font-family: var(--f-display); font-weight: 800; font-size: 18px; line-height: 1; }
.lv-bolts { display: flex; gap: 3px; }
.mini-bolt { width: 9px; height: 9px; clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); background: #b3b8be; }
.mini-bolt.on { background: linear-gradient(160deg, #e6c46e, #9c7429); }
.lv:disabled { opacity: .45; cursor: default; }
.lv.next { box-shadow: 0 2px 0 #9ea3a9, inset 0 0 0 2px var(--brass); }

.drawer { margin-top: auto; padding: 12px 20px calc(26px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, var(--deck-hi), var(--deck-lo));
  border-top: 1px solid #eef0f2; display: flex; flex-direction: column; gap: 12px; }
.home-spacer { flex: 1 0 24px; }
.drawer-head { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; color: var(--ink-2); }
.drawer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.fid { height: 84px; border-radius: 14px; background: linear-gradient(180deg, #eceef1, #cfd3d8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.fid-label { font-size: 11px; color: var(--ink-2); }
.tog-well { position: relative; width: 34px; height: 50px; border-radius: 8px; background: #0e0f10; box-shadow: inset 0 2px 4px #000; }
.tog-pivot { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #55575c; }
.tog-lever { position: absolute; left: 50%; top: 50%; width: 10px; height: 28px; margin-left: -5px; border-radius: 5px;
  background: linear-gradient(90deg, #8d9198, #eef0f3 45%, #7b7f86); transform-origin: 50% 0; transform: rotate(158deg);
  transition: transform .12s cubic-bezier(.3, 1.8, .5, 1); box-shadow: 0 3px 4px rgba(0,0,0,.6); }
.fid[aria-pressed="true"] .tog-lever { transform: rotate(202deg); }
.btn-well { width: 50px; height: 50px; border-radius: 50%; background: #0e0f10; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 4px #000; }
.btn-cap { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #ff8a5c, #d9461d 60%, #8c2a10); box-shadow: 0 3px 0 #5e1c0a; transition: transform .05s, box-shadow .05s; }
.fid.pressed .btn-cap { transform: translateY(3px); box-shadow: 0 0 0 #5e1c0a; }
.dial { width: 50px; height: 50px; border-radius: 50%; background: repeating-conic-gradient(#3a3b3f 0deg 6deg, #1a1b1d 6deg 12deg);
  display: flex; align-items: center; justify-content: center; transition: transform .2s cubic-bezier(.3, 1.5, .5, 1); box-shadow: 0 4px 6px rgba(0,0,0,.5); }
.dial-face { position: relative; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #5a5c61, #2a2b2e); }
.dial-mark { position: absolute; left: 50%; top: 4px; width: 3px; height: 10px; margin-left: -1.5px; border-radius: 2px; background: #d9b65e; }

/* ---------- BOARD ---------- */
#game { padding-top: env(safe-area-inset-top, 0px); }
.g-head { padding: 16px 20px 0; display: flex; align-items: center; gap: 12px; }
.back { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(180deg, #f7f8f9, #d3d7db); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--ink-3); box-shadow: 0 2px 0 #9ea3a9; flex: none; }
.back:active { transform: translateY(2px); box-shadow: none; }
.g-title { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.g-ch { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; color: var(--ink-2); }
.g-name { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.counter { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.flips { display: flex; gap: 2px; perspective: 120px; }
.flip { position: relative; width: 20px; height: 28px; border-radius: 4px; background: linear-gradient(180deg, var(--groove) 0, var(--groove) 48%, #1a1b1d 52%);
  display: flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-weight: 600; font-size: 18px; color: #e9e6df; box-shadow: inset 0 0 0 1px #2c2d31; }
.flip::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.8); }
.flip.go { animation: flip .22s ease-out; }
@keyframes flip { 0% { transform: rotateX(0); } 45% { transform: rotateX(-88deg); } 55% { transform: rotateX(88deg); } 100% { transform: rotateX(0); } }
.counter-sub { font-family: var(--f-mono); font-size: 10px; color: var(--ink-2); letter-spacing: .1em; }

.board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.board { position: relative; box-sizing: border-box; width: 350px; padding: 17px; border-radius: 20px; background: linear-gradient(180deg, var(--steel-hi), var(--steel-lo));
  box-shadow: inset 0 2px 6px rgba(0,0,0,.45), inset 0 0 0 1px #6a7078, 0 1px 0 #fff, 0 10px 24px rgba(60,65,72,.35); }
.board.shake { animation: shake .28s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 45% { transform: translateX(3px); } 70% { transform: translateX(-2px); } }
.screw { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8a8d93, #3a3c40); display: flex; align-items: center; justify-content: center; }
.screw i { width: 7px; height: 1.5px; background: #1a1b1d; }
.grid { position: relative; display: grid; grid-template-columns: repeat(5, 60px); gap: 4px; }
.tile { position: relative; width: 60px; height: 60px; border-radius: 7px; overflow: hidden; background: linear-gradient(145deg, var(--tile-hi), var(--tile-lo));
  box-shadow: inset 0 1px 0 #fff, inset 0 -2px 0 rgba(0,0,0,.2); cursor: default; }
.tile.live { cursor: pointer; }
.tile.live:active { filter: brightness(.96); }
.tile.wiggle { animation: wiggle .3s; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 60% { transform: rotate(3deg); } }
.tile.hint::after { content: ""; position: absolute; inset: 0; border-radius: 7px; background: rgba(224,189,99,.28); box-shadow: inset 0 0 0 4px var(--brass), inset 0 0 18px rgba(201,162,74,.9); animation: pulse .6s ease-in-out infinite alternate; pointer-events: none; }
@keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
.tile.blocked:not(.hint)::after { content: ""; position: absolute; inset: 0; border-radius: 7px; box-shadow: inset 0 0 0 3px var(--valve); opacity: .9; pointer-events: none; animation: fade 1s forwards; }
@keyframes fade { to { opacity: 0; } }
.rot { position: absolute; inset: 0; transition: transform .2s var(--spring); }
.rot.gear-rot { transition: transform .32s cubic-bezier(.3, 1.4, .5, 1); }
.g-straight { position: absolute; left: 23px; top: -4px; width: 14px; height: 68px; background: var(--groove); box-shadow: inset 3px 0 3px rgba(0,0,0,.8), 1px 0 0 rgba(255,255,255,.06), -1px 0 0 rgba(255,255,255,.06); }
.g-curve { position: absolute; left: 23px; top: -37px; width: 74px; height: 74px; border-radius: 50%; border: 14px solid var(--groove); box-sizing: border-box; }
.dimple { position: absolute; left: 27px; top: 27px; width: 6px; height: 6px; border-radius: 50%; background: #a3a8ae; box-shadow: inset 0 1px 1px rgba(0,0,0,.45); }
.blockface { position: absolute; inset: 6px; border-radius: 5px; background: repeating-linear-gradient(45deg, #a9aeb4 0 5px, #959ba2 5px 10px);
  box-shadow: inset 0 0 0 1px #868c93, 0 2px 3px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
.hex { width: 14px; height: 14px; clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); background: linear-gradient(160deg, #9a9da3, #4b4e53); }
.gate { position: absolute; left: 16px; top: 27px; width: 28px; height: 6px; border-radius: 2px; background: var(--valve); transition: transform .25s ease-out; box-shadow: 0 1px 2px rgba(0,0,0,.6); }
.open .gate { transform: translateX(22px); }
.wheel { position: absolute; right: 3px; bottom: 3px; width: 22px; height: 22px; transition: transform .35s cubic-bezier(.3, 1.3, .5, 1); }
.open .wheel { transform: rotate(135deg); }
.lamp { position: absolute; left: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--valve); box-shadow: 0 0 6px var(--valve); transition: background .2s, box-shadow .2s; }
.open .lamp { background: var(--signal); box-shadow: 0 0 6px var(--signal); }
/* linked-valve group plate: same letter = same pipe */
.vtag { position: absolute; right: 3px; top: 3px; width: 13px; height: 13px; border-radius: 3px; display: flex; align-items: center; justify-content: center;
  font-family: var(--f-mono); font-size: 9px; font-weight: 600; line-height: 1; box-shadow: 0 1px 1px rgba(0,0,0,.45); }
.vtag.g0 { background: #1b1c1e; color: #e0bd63; }
.vtag.g1 { background: linear-gradient(160deg, #e6c46e, #9c7429); color: #1b1408; }
.vtag.g2 { background: #e9ebee; color: #1b1c1e; box-shadow: inset 0 0 0 1px #1b1c1e; }
.tile.linked::before { content: ""; position: absolute; inset: 0; border-radius: 7px; box-shadow: inset 0 0 0 3px var(--valve); animation: fade .55s forwards; pointer-events: none; z-index: 2; }
.hopper-g { position: absolute; left: 23px; top: 30px; width: 14px; height: 34px; background: var(--groove); }
.hopper { position: absolute; left: 8px; top: 8px; width: 44px; height: 44px; border-radius: 50%;
  background: radial-gradient(circle, var(--groove) 0, var(--groove) 40%, #7e5f22 42%, var(--brass) 62%, #8a6a26 100%); box-shadow: 0 2px 4px rgba(0,0,0,.6); }
.tag { position: absolute; font-family: var(--f-mono); font-size: 8px; font-weight: 600; }
.cup-g { position: absolute; left: 23px; top: -4px; width: 14px; height: 34px; background: var(--groove); }
.cup { position: absolute; left: 12px; top: 12px; width: 36px; height: 36px; border-radius: 50%;
  background: radial-gradient(circle, #050606 0, #050606 45%, #2a2b2e 50%, #5c5e63 100%); box-shadow: 0 0 0 2px rgba(126,217,87,.35); transition: box-shadow .3s; }
.lit .cup { box-shadow: 0 0 0 2px var(--signal), 0 0 14px rgba(126,217,87,.7); }
.ball { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; pointer-events: none; z-index: 5;
  background: radial-gradient(circle at 35% 30%, #fff 0, #dfe2e6 16%, #8b9098 55%, #33363b 100%); box-shadow: 0 4px 5px rgba(0,0,0,.65); will-change: transform; }

.legend { padding: 12px 20px 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 18px; font-size: 12px; color: var(--ink-2); min-height: 30px; text-align: center; }
.legend.msg { color: #a33a18; font-weight: 600; }
.deck { margin-top: 12px; padding: 18px 24px calc(26px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, var(--deck-hi), var(--deck-lo)); border-top: 1px solid #eef0f2;
  display: grid; grid-template-columns: 64px 1fr 64px; gap: 14px; align-items: center; }
.round { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.round-cap { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #fff, #b4b9bf 75%); box-shadow: 0 4px 0 #858b92;
  display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--ink-3); transition: transform .06s, box-shadow .06s; }
.round:active:not(:disabled) .round-cap { transform: translateY(4px); box-shadow: 0 0 0 #858b92; }
.round:disabled { opacity: .5; cursor: default; }
.round-label { font-size: 11px; color: var(--ink-2); }
.hint-q { font-family: var(--f-display); font-weight: 800; color: #7a5c1e; }
.release { height: 72px; border-radius: 18px; background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); box-shadow: 0 5px 0 var(--brass-edge), inset 0 1px 0 rgba(255,255,255,.4);
  display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--brass-ink); transition: transform .06s, box-shadow .06s; }
.release:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--brass-edge), inset 0 1px 0 rgba(255,255,255,.4); }
.release:disabled { filter: saturate(.6) brightness(.95); cursor: default; }
.release.nudge { animation: nudge .8s ease-in-out 3; }
@keyframes nudge { 50% { box-shadow: 0 5px 0 var(--brass-edge), 0 0 0 6px rgba(201,162,74,.45); } }
.release-ball { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #a8adb4 50%, #3a3d42); box-shadow: 0 2px 3px rgba(0,0,0,.4); }
.release-txt { font-family: var(--f-display); font-weight: 900; font-size: 28px; letter-spacing: .06em; }

/* ---------- CLEAR ---------- */
#clear { background: radial-gradient(90% 50% at 50% 38%, #f6f7f8 0%, #cfd3d7 70%); padding-top: env(safe-area-inset-top, 0px); }
#clear.in { animation: zoomin .45s cubic-bezier(.2, .9, .3, 1); }
@keyframes zoomin { from { transform: scale(.86); opacity: 0; } to { transform: none; opacity: 1; } }
.c-label { padding: 34px 24px 0; text-align: center; font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; color: var(--ink-2); }
.c-cup { position: relative; margin: 26px auto 0; width: 220px; height: 220px; border-radius: 50%; flex: none;
  background: radial-gradient(circle, #050606 0, #050606 34%, #2a2b2e 37%, #4a4c51 60%, #26272a 72%, #1b1c1e 73%);
  box-shadow: 0 0 0 3px var(--signal), 0 0 50px rgba(126,217,87,.25); }
.c-ball { position: absolute; left: 66px; top: 66px; width: 88px; height: 88px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0, #e3e6ea 14%, #8b9098 55%, #2e3135 100%); box-shadow: 0 10px 18px rgba(0,0,0,.7); }
#clear.in .c-ball { animation: settle .6s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes settle { from { transform: translateY(-60px) scale(.7); } }
.stamp { position: absolute; right: -18px; top: 6px; padding: 8px 14px; border: 3px solid var(--valve); border-radius: 8px; transform: rotate(9deg); white-space: nowrap;
  font-family: var(--f-display); font-weight: 900; font-size: 30px; letter-spacing: .08em; color: var(--valve); background: rgba(244,245,247,.92); opacity: 0; }
.stamp.down { animation: stamp .32s cubic-bezier(.5, 0, .7, 1) forwards; }

<script>
// BALLWORKS engine — pure logic, no DOM. Shared by the game page and the node tools.
// Directions: N=0 E=1 S=2 W=3. Grid is 5 columns × 7 rows, index = r*5 + c.
const BW = (() => {
  const COLS = 5, ROWS = 7;
  const DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];
  const opp = d => (d + 2) & 3;
  const BASE = {
    start: [2], straight: [0, 2], curve: [0, 1], gear: [0, 1],
    valve: [0, 2], end: [0], block: [], plate: [],
  };
  const ROTATABLE = { straight: 1, curve: 1, gear: 1 };

  // level.grid: array of [type, rot] (rot optional). Returns a fresh mutable state.
  function initState(level) {
    return {
      rot: level.grid.map(t => t[1] || 0),
      open: level.grid.map(t => t[0] === 'valve' ? !!t[2] : true), // valves start closed unless [ 'valve', rot, true ]
    };
  }
  const cloneState = s => ({ rot: s.rot.slice(), open: s.open.slice() });
  const conns = (type, rot) => BASE[type].map(d => (d + rot) & 3);

  // Gear clusters: orthogonally adjacent gears mesh. Parity alternates (bipartite grid).
  function gearClusters(level) {
    const g = level.grid, seen = new Map(), clusters = [];
    g.forEach((t, i) => {
      if (t[0] !== 'gear' || seen.has(i)) return;
      const members = [], q = [[i, 1]]; seen.set(i, clusters.length);
      while (q.length) {
        const [k, p] = q.shift(); members.push({ i: k, p });
        const r = (k / COLS) | 0, c = k % COLS;
        for (let d = 0; d < 4; d++) {
          const rr = r + DR[d], cc = c + DC[d];
          if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
          const j = rr * COLS + cc;
          if (g[j][0] === 'gear' && !seen.has(j)) { seen.set(j, clusters.length); q.push([j, -p]); }
        }
      }
      clusters.push(members);
    });
    return clusters;
  }

  // Valve groups: grid entry ['valve', rot, open, 'A'] — same letter = linked. No letter = on its own.
  function valveGroups(level) {
    const byKey = new Map();
    level.grid.forEach((t, i) => {
      if (t[0] !== 'valve') return;
      const key = t[3] ? 'g:' + t[3] : 's:' + i;
      if (!byKey.has(key)) byKey.set(key, []);
      byKey.get(key).push(i);
    });
    return [...byKey.values()];
  }

  // Apply a tap. Returns { kind, changed: [{i, delta}] } or null if not interactive.
  function tap(level, state, i, clusters) {
    const type = level.grid[i][0];
    if (type === 'straight' || type === 'curve') {
      state.rot[i] = (state.rot[i] + 1) & 3;
      return { kind: 'click', changed: [{ i, delta: 1 }] };
    }
    if (type === 'gear') {
      clusters = clusters || gearClusters(level);
      const cl = clusters.find(c => c.some(m => m.i === i));
      const me = cl.find(m => m.i === i).p;
      const changed = cl.map(m => ({ i: m.i, delta: m.p === me ? 1 : -1 }));
      changed.forEach(({ i: k, delta }) => { state.rot[k] = (state.rot[k] + delta + 4) & 3; });
      return { kind: 'ratchet', changed };
    }
    if (type === 'valve') {
      // Valves sharing a group letter are piped together: one tap flips every valve in the group.
      const grp = valveGroups(level).find(g => g.includes(i));
      grp.forEach(k => { state.open[k] = !state.open[k]; });
      return { kind: 'hiss', changed: grp.map(k => ({ i: k, valve: true })) };
    }
    if (type === 'block') return { kind: 'thud', changed: [] };
    return null;
  }

  // Follow the ball from IN. Returns { steps:[{i, from, to}], result:'win'|'stop', stopAt, reason }
  // from = side the ball entered (null for IN), to = side it leaves (null for OUT).
  function trace(level, state) {
    const g = level.grid;
    const si = g.findIndex(t => t[0] === 'start');
    let dir = conns('start', state.rot[si])[0];
    const steps = [{ i: si, from: null, to: dir }];
    let r = (si / COLS) | 0, c = si % COLS;
    for (let n = 0; n < 64; n++) {
      const rr = r + DR[dir], cc = c + DC[dir];
      if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) return { steps, result: 'stop', stopAt: -1, reason: 'edge' };
      const j = rr * COLS + cc, t = g[j][0], entry = opp(dir);
      const cs = conns(t, state.rot[j]);
      if (!cs.includes(entry)) return { steps, result: 'stop', stopAt: j, reason: t === 'block' ? 'block' : t === 'plate' ? 'plate' : 'mismatch' };
      if (t === 'valve' && !state.open[j]) return { steps, result: 'stop', stopAt: j, reason: 'valve' };
      if (t === 'end') { steps.push({ i: j, from: entry, to: null }); return { steps, result: 'win' }; }
      if (t === 'start') return { steps, result: 'stop', stopAt: j, reason: 'mismatch' };
      const out = cs[0] === entry ? cs[1] : cs[0];
      steps.push({ i: j, from: entry, to: out });
      r = rr; c = cc; dir = out;
    }
    return { steps, result: 'stop', stopAt: -1, reason: 'loop' };
  }

  // Exact minimum taps from `state` to any winning configuration.
  // Returns { cost, target: { rot, open }, path:[cell indices] } or null if unsolvable.
  function solve(level, state) {
    const g = level.grid, N = g.length;
    const clusters = gearClusters(level);
    const gearInfo = new Map();
    clusters.forEach((cl, ci) => cl.forEach(m => gearInfo.set(m.i, { ci, p: m.p })));
    const si = g.findIndex(t => t[0] === 'start');
    const k = clusters.length;
    let best = null;
    const phaseCost = cl => {
      const both = cl.some(m => m.p === 1) && cl.some(m => m.p === -1);
      return ph => both ? Math.min(ph, 4 - ph) : ph;
    };
    const costFns = clusters.map(phaseCost);
    const phases = new Array(k).fill(0);
    const gearRot = j => { const gi = gearInfo.get(j); return (state.rot[j] + gi.p * phases[gi.ci] + 8) & 3; };
    const vgroups = valveGroups(level), vOf = new Map();
    vgroups.forEach((grp, gi) => grp.forEach(i => vOf.set(i, gi)));
    const flips = new Array(vgroups.length).fill(0);
    const isOpen = j => state.open[j] !== !!flips[vOf.get(j)];

    function dfs(i, dir, visited, cost, choices, base) {
      if (best && base + cost >= best.cost) return;
      const r = (i / COLS) | 0, c = i % COLS;
      const rr = r + DR[dir], cc = c + DC[dir];
      if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) return;
      const j = rr * COLS + cc;
      if (visited[j]) return;
      const t = g[j][0], e = opp(dir);
      const options = []; // [exitDir|null(end), cost, choice]
      if (t === 'end') { if (conns('end', state.rot[j]).includes(e)) options.push([null, 0, null]); }
      else if (t === 'straight') {
        const want = (e & 1); // 0 => vertical rot 0/2, 1 => horizontal rot 1/3
        const a = (want - state.rot[j] + 4) & 3, b = (want + 2 - state.rot[j] + 4) & 3;
        const [cst, tr] = a <= b ? [a, want] : [b, want + 2];
        options.push([opp(e), cst, { i: j, rot: tr }]);
      } else if (t === 'curve') {
        for (const x of [(e + 1) & 3, (e + 3) & 3]) {
          const tr = x === ((e + 1) & 3) ? e : x;
          options.push([x, (tr - state.rot[j] + 4) & 3, { i: j, rot: tr }]);
        }
      } else if (t === 'gear') {
        const cs = conns('gear', gearRot(j));
        if (cs.includes(e)) options.push([cs[0] === e ? cs[1] : cs[0], 0, null]);
      } else if (t === 'valve') {
        const cs = conns('valve', state.rot[j]);
        if (cs.includes(e) && isOpen(j)) options.push([cs[0] === e ? cs[1] : cs[0], 0, null]);
      }
      options.sort((a, b) => a[1] - b[1]);
      for (const [x, cst, ch] of options) {
        if (ch) choices.push(ch);
        visited[j] = 1;
        if (x === null) {
          const total = base + cost + cst;
          if (!best || total < best.cost) best = { cost: total, choices: choices.slice(), phases: phases.slice(), flips: flips.slice(), cells: Object.keys(visited).filter(q => visited[q]).map(Number) };
        } else dfs(j, x, visited, cost + cst, choices, base);
        visited[j] = 0;
        if (ch) choices.pop();
      }
    }

    const total = Math.pow(4, k), V = vgroups.length, vtotal = 1 << V;
    for (let vm = 0; vm < vtotal; vm++) {
      let vbase = 0;
      for (let q = 0; q < V; q++) { flips[q] = (vm >> q) & 1; vbase += flips[q]; }
      for (let m = 0; m < total; m++) {
        let x = m, base = vbase;
        for (let q = 0; q < k; q++) { phases[q] = x & 3; x >>= 2; base += costFns[q](phases[q]); }
        if (best && base >= best.cost) continue;
        const visited = {}; visited[si] = 1;
        dfs(si, conns('start', state.rot[si])[0], visited, 0, [], base);
      }
    }
    if (!best) return null;
    const target = cloneState(state);
    best.choices.forEach(ch => { target.rot[ch.i] = ch.rot; });
    vgroups.forEach((grp, gi) => { if (best.flips[gi]) grp.forEach(i => { target.open[i] = !target.open[i]; }); });
    clusters.forEach((cl, ci) => cl.forEach(m => { target.rot[m.i] = (state.rot[m.i] + m.p * best.phases[ci] + 8) & 3; }));
    return { cost: best.cost, target, phases: best.phases, clusters, flips: best.flips, vgroups, choices: best.choices };
  }

  // One tap that moves toward the optimal solution, in path order. Returns a cell index or -1.
  function hint(level, state) {
    const sol = solve(level, state);
    if (!sol || sol.cost === 0) return -1;
    const tr = trace(level, sol.target);
    for (const st of tr.steps) {
      const i = st.i, t = level.grid[i][0];
      if (t === 'gear') {
        const ci = sol.clusters.findIndex(cl => cl.some(m => m.i === i));
        const ph = sol.phases[ci];
        if (ph) {
          const cl = sol.clusters[ci];
          const wantP = ph <= 2 ? 1 : -1;
          const pick = cl.find(m => m.p === wantP) || cl[0];
          return pick.i;
        }
      } else if (t === 'valve') { if (!state.open[i]) return i; } // the tap flips its whole group, as the target needs
      else if (t === 'straight') { if ((state.rot[i] & 1) !== (sol.target.rot[i] & 1)) return i; }
      else if (state.rot[i] !== sol.target.rot[i]) return i;
    }
    // A gear cluster off the path may still need turning (not normally reachable since cost counts only path).
    for (let ci = 0; ci < sol.clusters.length; ci++) if (sol.phases[ci]) return sol.clusters[ci][0].i;
    return -1;
  }

  return { COLS, ROWS, DR, DC, opp, conns, initState, cloneState, gearClusters, valveGroups, tap, trace, solve, hint, ROTATABLE };
})();


</script>

/* ---------- storage (per-viewer convenience; game works without it) ---------- */
const SAVE_KEY = 'ballworks.v1';
function load() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(store)); } catch (e) {} }
const store = Object.assign({ done: {}, sound: true }, load());

/* ---------- sound: synthesized with Web Audio, no files ---------- */
let ac = null, rollNode = null;
function audio() {
  if (!store.sound) return null;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { return null; }
  return ac;
}
function noiseBuf(ctx, dur, curve) {
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur)), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (curve == null ? 1 : Math.pow(1 - i / len, curve));
  return b;
}
function burst(ctx, at, dur, freq, q, gain, curve = 3) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf(ctx, dur, curve);
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(); g.gain.value = gain;
  s.connect(f).connect(g).connect(ctx.destination); s.start(at);
}
function tone(ctx, at, freq, dur, gain) {
  const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = freq;
  g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(ctx.destination); o.start(at); o.stop(at + dur + .02);
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
function snd(kind) {
  if (store.sound) buzz(kind === 'thud' || kind === 'stamp' ? 20 : kind === 'ratchet' ? [8, 40, 8, 40, 8] : 10);
  const ctx = audio(); if (!ctx) return;
  const t = ctx.currentTime;
  switch (kind) {
    case 'click': burst(ctx, t, .035, 3400, 4, 1.4); burst(ctx, t + .014, .05, 1500, 6, .7); break;
    case 'ratchet': for (let i = 0; i < 4; i++) burst(ctx, t + i * .05, .03, 2400 + i * 120, 5, 1); break;
    case 'hiss': burst(ctx, t, .5, 5500, .6, .5, 1.5); burst(ctx, t + .38, .09, 200, 2, 2); break;
    case 'thud': burst(ctx, t, .08, 260, 2, 2); break;
    case 'pop': burst(ctx, t, .04, 900, 3, 1.5); tone(ctx, t, 420, .08, .15); break;
    case 'drop': burst(ctx, t, .07, 420, 2, 1.8); burst(ctx, t + .06, .09, 240, 2, 2.2); break; // 덜컹
    case 'arrive': tone(ctx, t, 1760, .9, .08); tone(ctx, t, 2640, .9, .045); break;        // 팅—
    case 'stamp': burst(ctx, t, .12, 200, 2, 2.4); break;                                   // 쿵
  }
}
function rollStart() {
  const ctx = audio(); if (!ctx || rollNode) return;
  const s = ctx.createBufferSource(); s.buffer = noiseBuf(ctx, 1, null); s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220; f.Q.value = 1.2;
  const g = ctx.createGain(); g.gain.setValueAtTime(0, ctx.currentTime); g.gain.linearRampToValueAtTime(.55, ctx.currentTime + .08);
  s.connect(f).connect(g).connect(ctx.destination); s.start();
  rollNode = { s, g };
}
function rollStop() {
  if (!rollNode || !ac) { rollNode = null; return; }
  const { s, g } = rollNode; rollNode = null;
  g.gain.cancelScheduledValues(ac.currentTime); g.gain.setValueAtTime(g.gain.value, ac.currentTime);
  g.gain.linearRampToValueAtTime(0, ac.currentTime + .08); s.stop(ac.currentTime + .1);
}

/* ---------- app scaling: 390-wide column, at least 740 tall ---------- */
const app = document.getElementById('app');
function fit() {
  const W = window.innerWidth, H = window.innerHeight;
  let s = Math.min(W / 390, 1.15);
  if (H / s < 740) s = H / 740;
  app.style.transform = `translateX(${(W - 390 * s) / 2}px) scale(${s})`;
  app.style.height = (H / s) + 'px';
}
window.addEventListener('resize', fit); fit();

/* ---------- progress ---------- */
const isDone = i => !!store.done[LEVELS[i].id];
const unlocked = i => i === 0 || isDone(i - 1);
function nextIndex() { for (let i = 0; i < LEVELS.length; i++) if (!isDone(i)) return i; return -1; }
const boltsFor = (moves, min) => moves <= min ? 3 : moves <= min + 3 ? 2 : 1;

/* ---------- screens ---------- */
const $ = id => document.getElementById(id);
function show(name) {
  ['home', 'game', 'clear'].forEach(n => { $(n).hidden = n !== name; });
  G.screen = name;
}

/* ---------- HOME ---------- */
let openChapter = -1;
function renderHome() {
  const ni = nextIndex();
  const card = $('contCard');
  if (ni === -1) {
    const total = LEVELS.reduce((s, l) => s + (store.done[l.id] ? store.done[l.id].bolts : 0), 0);
    $('contCh').textContent = '전 챕터 통과'; $('contPos').textContent = `볼트 ${total} / ${LEVELS.length * 3}`;
    const left = LEVELS.length * 3 - total;
    $('contId').textContent = '완주'; $('contName').textContent = left ? `남은 볼트 ${left}개` : '볼트 전부 수집'; $('contGo').textContent = '1-01부터';
    card.dataset.idx = 0; $('contSegs').innerHTML = '';
  } else {
    const lv = LEVELS[ni], ch = chOf(lv), inCh = LEVELS.filter(l => chOf(l) === ch);
    const pos = inCh.indexOf(lv);
    $('contCh').textContent = `${Object.keys(store.done).length ? '이어서' : '시작'} · CH.${CHAPTERS[ch].n} ${CHAPTERS[ch].name}`;
    $('contPos').textContent = `${String(pos + 1).padStart(2, '0')} / ${String(inCh.length).padStart(2, '0')}`;
    $('contId').textContent = lv.id; $('contName').textContent = lv.name;
    $('contGo').textContent = Object.keys(store.done).length ? '계속하기' : '시작하기';
    card.dataset.idx = ni;
    const segs = $('contSegs'); segs.style.gridTemplateColumns = `repeat(${inCh.length}, 1fr)`;
    segs.innerHTML = inCh.map((l, k) => `<span class="seg ${store.done[l.id] ? 'on' : k === pos ? 'now' : ''}"></span>`).join('');
  }
  const list = $('chapters'); list.innerHTML = '';
  CHAPTERS.forEach((c, ci) => {
    const lvIdx = LEVELS.map((l, i) => i).filter(i => chOf(LEVELS[i]) === ci);
    const open = !c.soon && lvIdx.length && unlocked(lvIdx[0]);
    const doneN = lvIdx.filter(isDone).length;
    const el = document.createElement('div');
    el.className = 'ch' + (open ? '' : ' locked');
    el.innerHTML = `<button class="ch-row" ${open ? '' : 'disabled'} aria-expanded="${openChapter === ci}">
        <span class="ch-num">${c.n}</span>
        <span class="ch-txt"><span class="ch-name">${c.name}</span><span class="ch-sub">${c.sub}</span></span>
        <span class="ch-prog">${c.soon ? '준비 중' : open ? `${String(doneN).padStart(2, '0')}/${String(lvIdx.length).padStart(2, '0')}` : '잠김'}</span>
      </button>
      <div class="levels" ${openChapter === ci ? '' : 'hidden'}>${lvIdx.map(i => {
        const d = store.done[LEVELS[i].id], b = d ? d.bolts : 0;
        return `<button class="lv ${i === ni ? 'next' : ''}" data-idx="${i}" ${unlocked(i) ? '' : 'disabled'} aria-label="${LEVELS[i].id} ${LEVELS[i].name}${d ? `, 볼트 ${b}개` : ''}">
          <span class="lv-id">${LEVELS[i].id}</span><span class="lv-bolts">${[0, 1, 2].map(k => `<i class="mini-bolt ${k < b ? 'on' : ''}"></i>`).join('')}</span></button>`;
      }).join('')}</div>`;
    if (open) el.querySelector('.ch-row').addEventListener('click', () => { snd('click'); openChapter = openChapter === ci ? -1 : ci; renderHome(); });
    el.querySelectorAll('.lv').forEach(b => b.addEventListener('click', () => { snd('click'); startLevel(+b.dataset.idx); }));
    list.appendChild(el);
  });
  const k = $('soundKnob'); k.setAttribute('aria-pressed', String(store.sound)); $('soundLabel').textContent = store.sound ? '소리 켬' : '소리 끔';
}
$('contCard').addEventListener('click', () => { snd('click'); startLevel(+$('contCard').dataset.idx); });
$('soundKnob').addEventListener('click', () => { store.sound = !store.sound; save(); if (!store.sound) rollStop(); renderHome(); snd('click'); });
let dialN = 0;
$('fidToggle').addEventListener('click', e => { const b = e.currentTarget; b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); snd('click'); });
const fb = $('fidButton');
fb.addEventListener('pointerdown', () => { fb.classList.add('pressed'); snd('pop'); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => fb.addEventListener(ev, () => fb.classList.remove('pressed')));
fb.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { fb.classList.add('pressed'); snd('pop'); setTimeout(() => fb.classList.remove('pressed'), 120); } });
$('fidDial').addEventListener('click', () => { dialN++; $('dial').style.transform = `rotate(${dialN * 30}deg)`; snd('ratchet'); });

/* ---------- GAME ---------- */
const G = { screen: 'home', li: 0, st: null, deg: [], moves: 0, hints: 2, rolling: false, t0: 0, dist: 0, clusters: null, tiles: [] };

function tileHTML(type, i) {
  switch (type) {
    case 'plate': return '<span class="dimple"></span>';
    case 'block': return '<span class="blockface"><span class="hex"></span></span>';
    case 'straight': return '<span class="rot"><span class="g-straight"></span></span>';
    case 'curve': return '<span class="rot"><span class="g-curve"></span></span>';
    case 'gear': return `<span class="rot gear-rot"><svg width="60" height="60" viewBox="0 0 60 60" style="position:absolute;inset:0" aria-hidden="true">
        <circle cx="30" cy="30" r="25" fill="none" stroke="#a9823a" stroke-width="7" stroke-dasharray="4.9 4.9"/>
        <circle cx="30" cy="30" r="22" fill="#b8913f"/><circle cx="30" cy="30" r="19" fill="none" stroke="#8a6a26" stroke-width="1"/></svg>
        <span class="g-curve"></span></span>`;
    case 'valve': return `<span class="rot vrot"><span class="g-straight"></span><span class="gate"></span></span>
        <svg class="wheel" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="#e2552b" stroke-width="2.5"/>
        <line x1="11" y1="2" x2="11" y2="20" stroke="#e2552b" stroke-width="2"/><line x1="2" y1="11" x2="20" y2="11" stroke="#e2552b" stroke-width="2"/>
        <circle cx="11" cy="11" r="2.5" fill="#f2c9b8"/></svg><span class="lamp"></span>`;
    case 'start': return '<span class="hopper-g"></span><span class="hopper"></span><span class="tag" style="left:2px;top:2px;color:#7a5c1e">IN</span>';
    case 'end': return '<span class="cup-g"></span><span class="cup"></span><span class="tag" style="right:3px;bottom:2px;color:#2f7a17">OUT</span>';
  }
  return '';
}
const NAMES = { straight: '직선 레일', curve: '곡선 레일', gear: '톱니', valve: '밸브', block: '고정 블록', plate: '빈 판', start: '시작 호퍼', end: '도착 컵' };

function startLevel(i, keepTimer) {
  const lv = LEVELS[i];
  G.li = i; G.st = BW.initState(lv); G.clusters = BW.gearClusters(lv);
  G.deg = G.st.rot.map(r => r * 90); G.moves = 0; G.hints = 2; G.rolling = false;
  if (!keepTimer) { G.t0 = Date.now(); G.dist = 0; }
  const ch = chOf(lv), C = CHAPTERS[ch];
  $('gCh').textContent = `CH.${C.n} ${C.name}`;
  $('gName').textContent = `${lv.id} ${lv.name}`;
  $('gMin').textContent = `이동 · 최소 ${lv.min}`;
  setLegend();
  const grid = $('grid'); grid.innerHTML = ''; G.tiles = [];
  lv.grid.forEach((t, k) => {
    const el = document.createElement('div');
    const live = ['straight', 'curve', 'gear', 'valve', 'block'].includes(t[0]);
    el.className = 'tile' + (live ? ' live' : '');
    el.setAttribute('role', 'gridcell');
    if (live) { el.tabIndex = 0; }
    const grp = t[0] === 'valve' && t[3] ? t[3] : '';
    el.setAttribute('aria-label', `${NAMES[t[0]]}${grp ? ' ' + grp : ''}, ${((k / 5) | 0) + 1}행 ${(k % 5) + 1}열`);
    el.innerHTML = tileHTML(t[0], k) + (grp ? `<span class="vtag g${'ABC'.indexOf(grp)}">${grp}</span>` : '');
    if (live) {
      el.addEventListener('pointerdown', e => { e.preventDefault(); onTap(k); });
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTap(k); } });
    }
    grid.appendChild(el); G.tiles.push(el);
    paintTile(k, true);
  });
  const ball = document.createElement('div'); ball.className = 'ball'; ball.id = 'ball'; ball.hidden = true; grid.appendChild(ball);
  setFlips(0, true); updateDeck();
  show('game');
}
function paintTile(k, instant) {
  const t = LEVELS[G.li].grid[k][0], el = G.tiles[k];
  if (t === 'straight' || t === 'curve' || t === 'gear') {
    const r = el.querySelector('.rot');
    if (instant) { r.style.transition = 'none'; r.style.transform = `rotate(${G.deg[k]}deg)`; r.offsetWidth; r.style.transition = ''; }
    else r.style.transform = `rotate(${G.deg[k]}deg)`;
  } else if (t === 'valve') {
    el.querySelector('.vrot').style.transform = `rotate(${G.st.rot[k] * 90}deg)`;
    el.classList.toggle('open', G.st.open[k]);
    el.querySelector('.vrot').style.transition = 'none';
  }
}
function setLegend(msg) {
  const L = $('legend');
  if (msg) { L.className = 'legend msg'; L.textContent = msg; return; }
  L.className = 'legend';
  L.innerHTML = CHAPTERS[chOf(LEVELS[G.li])].legend.map(s => `<span>${s}</span>`).join('');
}
let flipsPrev = '000';
function setFlips(n, instant) {
  const s = String(Math.min(n, 999)).padStart(3, '0'), els = $('flips').children;
  for (let k = 0; k < 3; k++) {
    if (instant || s[k] !== flipsPrev[k]) {
      const el = els[k];
      if (instant) { el.textContent = s[k]; continue; }
      el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
      setTimeout(() => { el.textContent = s[k]; }, 100);
    }
  }
  flipsPrev = s;
}
function updateDeck() {
  $('hintLabel').textContent = `힌트 ${G.hints}`;
  $('hintBtn').disabled = G.hints <= 0 || G.rolling;
  $('releaseBtn').disabled = G.rolling; $('resetBtn').disabled = G.rolling;
}
function clearMarks() { G.tiles.forEach(t => t.classList.remove('hint', 'blocked')); $('releaseBtn').classList.remove('nudge'); }

function onTap(k) {
  if (G.rolling || G.screen !== 'game') return;
  const lv = LEVELS[G.li];
  const res = BW.tap(lv, G.st, k, G.clusters);
  if (!res) return;
  snd(res.kind);
  if (res.kind === 'thud') { const el = G.tiles[k]; el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle'); return; }
  clearMarks(); setLegend();
  res.changed.forEach(c => {
    if (c.valve) {
      paintTile(c.i);
      if (c.i !== k) { const el = G.tiles[c.i]; el.classList.remove('linked'); void el.offsetWidth; el.classList.add('linked'); }
    } else { G.deg[c.i] += c.delta * 90; paintTile(c.i); }
  });
  G.moves++; setFlips(G.moves);
}

$('resetBtn').addEventListener('click', () => {
  if (G.rolling) return;
  snd('ratchet');
  const lv = LEVELS[G.li]; G.st = BW.initState(lv);
  // spin back the short way so tiles visibly return
  G.deg = G.deg.map((d, k) => { const target = G.st.rot[k] * 90; const cur = ((d % 360) + 360) % 360; let diff = target - cur; if (diff > 180) diff -= 360; if (diff < -180) diff += 360; return d + diff; });
  lv.grid.forEach((t, k) => paintTile(k));
  G.moves = 0; setFlips(0); clearMarks(); setLegend();
});
$('hintBtn').addEventListener('click', () => {
  if (G.rolling || G.hints <= 0) return;
  clearMarks();
  const h = BW.hint(LEVELS[G.li], G.st);
  G.hints--; updateDeck(); snd('pop');
  if (h < 0) { $('releaseBtn').classList.add('nudge'); setLegend('길이 다 이어졌어요 — 구슬을 투하하세요'); return; }
  G.tiles[h].classList.add('hint');
  const t = LEVELS[G.li].grid[h][0];
  setLegend(t === 'valve' ? (LEVELS[G.li].grid[h][3] ? '반짝이는 밸브를 탭하세요 — 같은 글자도 함께 뒤집혀요' : '반짝이는 밸브를 열어 보세요') : t === 'gear' ? '반짝이는 톱니를 돌려 보세요' : '반짝이는 칸을 돌려 보세요');
});
$('backBtn').addEventListener('click', () => { if (G.rolling) return; snd('click'); renderHome(); show('home'); });

/* ---------- rolling ---------- */
const center = i => [(i % 5) * PITCH + TILE / 2, ((i / 5) | 0) * PITCH + TILE / 2];
const edge = (i, d) => { const [x, y] = center(i); return [x + BW.DC[d] * HALF, y + BW.DR[d] * HALF]; };
// Position along a tile segment at u∈[0,1]: straight line, or quarter arc around the shared corner.
function segPoint(st, u) {
  const [cx, cy] = center(st.i);
  const a = st.from == null ? [cx, cy] : edge(st.i, st.from);
  const b = st.to == null ? [cx, cy] : edge(st.i, st.to);
  if (st.from == null || st.to == null || ((st.from + 2) & 3) === st.to) return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
  const ox = cx + (BW.DC[st.from] + BW.DC[st.to]) * HALF, oy = cy + (BW.DR[st.from] + BW.DR[st.to]) * HALF;
  const a0 = Math.atan2(a[1] - oy, a[0] - ox); let a1 = Math.atan2(b[1] - oy, b[0] - ox);
  let da = a1 - a0; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
  const ang = a0 + da * u;
  return [ox + Math.cos(ang) * HALF, oy + Math.sin(ang) * HALF];
}
function animate(dur, fn) { return new Promise(res => { const t0 = performance.now(); (function step(now) { const u = Math.min(1, (now - t0) / dur); fn(u); if (u < 1) requestAnimationFrame(step); else res(); })(t0); }); }
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

async function release() {
  if (G.rolling || G.screen !== 'game') return;
  const lv = LEVELS[G.li], tr = BW.trace(lv, G.st);
  G.rolling = true; updateDeck(); clearMarks(); setLegend();
  const ball = $('ball'), place = (x, y, s = 1) => { ball.style.transform = `translate(${x}px, ${y}px) scale(${s})`; };
  const speed = reduced() ? .35 : 1;
  ball.hidden = false; ball.style.opacity = 1;
  const [sx, sy] = center(tr.steps[0].i);
  snd('drop');
  await animate(220 * speed, u => place(sx, sy - 18 * (1 - u), .6 + .4 * u));
  rollStart();
  for (let s = 0; s < tr.steps.length; s++) {
    const st = tr.steps[s];
    const dur = (st.from == null || st.to == null ? 110 : 180) * speed;
    await animate(dur, u => { const [x, y] = segPoint(st, u); place(x, y); });
    if (st.from != null && st.to != null) G.dist += M_PER_TILE;
  }
  rollStop();
  if (tr.result === 'win') {
    const endEl = G.tiles[tr.steps[tr.steps.length - 1].i];
    endEl.classList.add('lit'); snd('arrive');
    const [ex, ey] = center(tr.steps[tr.steps.length - 1].i);
    await animate(260 * speed, u => place(ex, ey, 1 - .35 * u));
    await wait(550 * speed);
    win();
    return;
  }
  // stopped: nudge back from the gap, thud, mark the culprit
  const last = tr.steps[tr.steps.length - 1];
  const [bx, by] = segPoint(last, 1), [cx, cy] = center(last.i);
  snd('thud');
  await animate(140, u => { const k = Math.sin(u * Math.PI) * .18; place(bx + (cx - bx) * k, by + (cy - by) * k); });
  if (tr.stopAt >= 0) { const el = G.tiles[tr.stopAt]; el.classList.remove('blocked', 'wiggle'); void el.offsetWidth; el.classList.add('blocked', 'wiggle'); }
  else { const b = $('board'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
  setLegend({ valve: '닫힌 밸브에 막혔어요', block: '고정 블록에 부딪혔어요', plate: '빈 판 — 레일이 없어요', mismatch: '다음 칸 홈이 안 맞아요', edge: '보드 밖으로 나가려 했어요' }[tr.reason] || '구슬이 멈췄어요');
  await wait(650);
  await animate(200, u => { ball.style.opacity = 1 - u; });
  ball.hidden = true; ball.style.opacity = 1;
  G.rolling = false; updateDeck();
}
$('releaseBtn').addEventListener('click', release);

/* ---------- CLEAR ---------- */
function fmtTime(ms) { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
function win() {
  const lv = LEVELS[G.li], bolts = boltsFor(G.moves, lv.min), elapsed = Date.now() - G.t0;
  const prev = store.done[lv.id];
  store.done[lv.id] = { bolts: Math.max(bolts, prev ? prev.bolts : 0), best: Math.min(G.moves, prev ? prev.best : Infinity) };
  save();
  G.rolling = false;
  $('cLabel').textContent = `${lv.id} ${lv.name}`;
  const extra = G.moves - lv.min;
  $('cMsg').textContent = bolts === 3 ? (extra < 0 ? `최소보다 ${-extra}번 적게 — 이건 설계도에 없던 길이에요` : '최소 이동 그대로 — 볼트 세 개 전부')
    : bolts === 2 ? `최소 이동보다 ${extra}번 더 — 볼트 하나 남음` : `최소 이동보다 ${extra}번 더 — ${lv.min}번 안에 다시 도전해 보세요`;
  $('sMoves').textContent = G.moves; $('sTime').textContent = fmtTime(elapsed); $('sDist').textContent = G.dist.toFixed(1) + 'm';
  const B = $('bolts'); B.innerHTML = [0, 1, 2].map(() => '<span class="bolt"><i></i></span>').join('');
  const nx = G.li + 1;
  $('nextBtn').textContent = nx < LEVELS.length ? `다음 · ${LEVELS[nx].id}` : '홈으로';
  $('nextBtn').dataset.next = nx < LEVELS.length ? nx : -1;
  const sc = $('clear'), stamp = $('stamp');
  stamp.classList.remove('down'); sc.classList.remove('in'); void sc.offsetWidth; sc.classList.add('in');
  show('clear');
  setTimeout(() => { stamp.classList.add('down'); setTimeout(() => snd('stamp'), 300); }, 420);
  [...B.children].forEach((b, k) => { if (k < bolts) setTimeout(() => { b.classList.add('on', 'pop'); snd('click'); }, 900 + k * 180); });
}
$('nextBtn').addEventListener('click', () => { snd('click'); const n = +$('nextBtn').dataset.next; if (n >= 0) startLevel(n); else { renderHome(); show('home'); } });
$('retryBtn').addEventListener('click', () => { snd('click'); startLevel(G.li); });
$('homeBtn').addEventListener('click', () => { snd('click'); renderHome(); show('home'); });

/* ---------- boot (keeps an in-progress board across live updates of this page) ---------- */
const levelSig = lv => JSON.stringify(lv.grid);
function start(data) {
  renderHome();
  const lv = data && LEVELS[data.li];
  if (data && data.screen === 'game' && lv) {
    startLevel(data.li);
    // Restore the board only if it is the very same layout; a changed level starts fresh.
    if (data.rot && data.open && data.id === lv.id && data.sig === levelSig(lv)) {
      lv.grid.forEach((t, k) => {
        if (BW.ROTATABLE[t[0]]) G.st.rot[k] = data.rot[k] & 3;
        if (t[0] === 'valve') G.st.open[k] = !!data.open[k];
      });
      G.deg = G.st.rot.map(r => r * 90);
      LEVELS[G.li].grid.forEach((t, k) => paintTile(k, true));
      G.moves = data.moves || 0; G.hints = data.hints ?? 2; G.t0 = Date.now() - (data.elapsed || 0); G.dist = data.dist || 0;
      setFlips(G.moves, true); updateDeck();
    }
  } else show('home');
}
try { window.claude?.hot?.snapshot?.(() => ({ screen: G.screen, li: G.li, id: LEVELS[G.li].id, sig: levelSig(LEVELS[G.li]), rot: G.st && G.st.rot, open: G.st && G.st.open, moves: G.moves, hints: G.hints, elapsed: Date.now() - G.t0, dist: G.dist })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
window.__BW = { G, LEVELS, onTap, release, BW };
</script>
